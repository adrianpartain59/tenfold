<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Studio · Glow-up</title>
<style>
  :root {
    --page: #ECECEF; --panel: #FFFFFF; --ink: #1C1C1E; --ink2: #6B6B73; --ink3: #A1A1AA; --line: #DEDEE3;
    --pick: #1F7AE0; --fav: #D6457A; --wild: #B7791F; --bezel: #0D0D0F;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 14px 40px rgba(0,0,0,.12);
  }
  html[data-theme="dark"] {
    --page: #0B0B0D; --panel: #17171A; --ink: #EDEDF0; --ink2: #9A9AA3; --ink3: #62626B; --line: #2A2A30;
    --pick: #5AA2F0; --fav: #F06A9A; --wild: #E0A64A; --bezel: #2B2B30;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 40px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  header { max-width: 1680px; margin: 0 auto; padding: 28px 24px 8px; display: grid; gap: 10px; }
  .crumbs { color: var(--ink2); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .crumbs a { text-decoration: none; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .crumbs a.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; line-height: 1.15; }
  .brief { margin: 0; max-width: 900px; color: var(--ink2); font-size: 15px; }
  .feedback { max-width: 900px; margin: 2px 0 0; padding: 10px 14px; border-left: 3px solid var(--pick); background: var(--panel); border-radius: 0 10px 10px 0; font-size: 14px; }
  .feedback b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin-bottom: 2px; }
  .bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .bar > div { max-width: 1680px; margin: 0 auto; padding: 10px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .seg button { border: 0; background: none; color: var(--ink2); font: inherit; font-size: 12px; font-weight: 650; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: var(--page); }
  .legend { margin-left: auto; display: flex; gap: 14px; color: var(--ink2); font-size: 12px; font-weight: 600; flex-wrap: wrap; }
  .hint { color: var(--ink3); font-size: 12px; }
  main { max-width: 1680px; margin: 0 auto; padding: 22px 24px 120px; display: grid; gap: 40px 22px; grid-template-columns: repeat(auto-fill, minmax(calc(var(--w) + 8px), 1fr)); }
  /* --wn = unitless screen width in px; the phone adds an 8px bezel each side */
  body { --wn: 284; }
  body[data-size="s"] { --wn: 204; }
  body[data-size="l"] { --wn: 393; }
  body, .phone { --w: calc(var(--wn) * 1px + 16px); --s: calc(var(--wn) / 393); }
  .card { display: grid; gap: 12px; align-content: start; justify-items: center; cursor: zoom-in; }
  .meta { width: var(--w); display: grid; gap: 4px; }
  .meta .top { display: flex; align-items: baseline; gap: 8px; }
  .num { font-size: 26px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .idea { margin: 0; color: var(--ink2); font-size: 13px; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); }
  .chip.wild { color: var(--wild); border-color: currentColor; }
  .chip.pick { color: #fff; background: var(--pick); border-color: var(--pick); }
  .chip.fav { color: #fff; background: var(--fav); border-color: var(--fav); }
  .chip.cur { color: var(--page); background: var(--ink2); border-color: var(--ink2); }
  .chip.var { color: var(--pick); border-color: currentColor; }
  .chip.ctl { color: var(--page); background: var(--ink); border-color: var(--ink); }
  .phone { width: var(--w); height: calc(var(--wn) * 852px / 393 + 16px); border-radius: calc(55px * var(--s) + 8px); border: 8px solid var(--bezel); background: var(--bezel); box-shadow: var(--shadow); overflow: hidden; position: relative; transition: transform .15s ease; }
  .card:hover .phone { transform: translateY(-3px); }
  .phone.pick { outline: 3px solid var(--pick); outline-offset: 4px; }
  .phone.fav { outline: 3px solid var(--fav); outline-offset: 4px; }
  .phone.pick.fav { outline-color: var(--pick); box-shadow: 0 0 0 10px var(--fav), var(--shadow); }
  .phone .viewport { position: absolute; left: 0; top: 0; width: 393px; height: 852px; transform: scale(var(--s)); transform-origin: 0 0; }
  .phone iframe, .phone img { width: 393px; height: 852px; border: 0; display: block; background: #fff; pointer-events: none; }
  .phone img { object-fit: cover; object-position: top; }
  .island { position: absolute; top: calc(11px * var(--s)); left: 50%; width: calc(124px * var(--s)); height: calc(36px * var(--s)); transform: translateX(-50%); background: #000; border-radius: 999px; z-index: 2; pointer-events: none; }
  /* focus */
  .focus { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--page) 94%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: none; grid-template-columns: 1fr auto minmax(260px, 380px) 1fr; gap: 36px; align-items: center; padding: 24px; }
  .focus.open { display: grid; }
  .focus .phone { grid-column: 2; cursor: default; }
  .focus .phone iframe { pointer-events: auto; }
  .focus .side { grid-column: 3; display: grid; gap: 12px; align-content: center; }
  .focus .side .num { font-size: 44px; }
  .focus .side .name { font-size: 22px; }
  .focus .side .idea { font-size: 15px; }
  .notes { display: grid; gap: 10px; margin-top: 4px; }
  .notes div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .notes b { display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin-bottom: 2px; }
  .nav { position: fixed; top: 50%; transform: translateY(-50%); border: 1px solid var(--line); background: var(--panel); color: var(--ink); width: 44px; height: 44px; border-radius: 999px; font-size: 20px; cursor: pointer; box-shadow: var(--shadow); }
  .nav.prev { left: 20px; } .nav.next { right: 20px; }
  .close { position: fixed; top: 18px; right: 20px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 650; cursor: pointer; }
  .err { max-width: 900px; margin: 60px auto; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  /* Touch / narrow: the focused frame must not swallow swipes, or the overlay
     can't scroll and looks stuck on one variation (seen 2026-09-27). */
  @media (pointer: coarse), (max-width: 820px) {
    .focus .phone iframe { pointer-events: none; }
    .nav { top: auto; bottom: 20px; transform: none; z-index: 30; }
    .close { z-index: 30; }
  }
  @media (max-width: 820px) {
    .focus { grid-template-columns: 1fr; overflow: auto; -webkit-overflow-scrolling: touch; align-content: start; padding-bottom: 90px; }
    .focus .phone, .focus .side { grid-column: 1; justify-self: center; }
    .legend { margin-left: 0; }
  }
  main.board { display: grid; grid-template-columns: 1fr; gap: 34px; }
  .row { display: grid; grid-template-columns: 240px repeat(4, var(--w)); gap: 18px; align-items: start; overflow-x: auto; }
  .row.pair { grid-template-columns: 240px repeat(2, var(--w)); }
  .row.sys { grid-template-columns: 240px 1fr; }
  .routes { display: grid; grid-template-columns: repeat(auto-fill, var(--w)); gap: 18px; }
  .row .meta { width: auto; }
  .row.before .phone, .row.before .desk { outline: 2px dashed var(--ink3); outline-offset: 4px; }
  /* Web surface: desktop frames, 1440 x 900 scaled to --dw, two per line */
  body { --dw: 560; } body[data-size="s"] { --dw: 400; } body[data-size="l"] { --dw: 840; }
  .desk { --ds: calc(var(--dw) / 1440); width: calc(var(--dw) * 1px + 2px); height: calc(var(--dw) * 900px / 1440 + 2px); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative; background: #fff; box-shadow: var(--shadow); }
  .desk .viewport { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform: scale(var(--ds)); transform-origin: 0 0; }
  .desk iframe, .desk img { width: 1440px; height: 900px; border: 0; display: block; background: #fff; pointer-events: none; }
  .desk img { object-fit: cover; object-position: top; }
  body.web .row { grid-template-columns: 240px repeat(2, calc(var(--dw) * 1px + 2px)); }
  body.web .row > .meta { grid-row: span 2; }
  body.web .row.pair > .meta { grid-row: auto; }
  body.web .routes { grid-template-columns: repeat(auto-fill, calc(var(--dw) * 1px + 2px)); }
  .focus .desk { grid-column: 2; --dw: 820; cursor: default; }
  .focus .desk iframe { pointer-events: auto; }
  .screenlbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin-bottom: 6px; }
  .more { justify-self: start; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
  .headline { margin: 0; font-size: 18px; font-weight: 700; }
  pre.cat { margin: 0; white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .spec { display: grid; gap: 14px; max-height: 80vh; overflow: auto; }
  .spec .lbl { display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin-bottom: 6px; }
  .spec small { display: block; color: var(--ink2); margin-top: 4px; }
  .spec ul { margin: 4px 0 0; padding-left: 18px; }
  .sw { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw i { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); }
  .tpls { display: grid; gap: 8px; }
  .tpl { display: grid; gap: 3px; height: 34px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; }
  .tpl i { background: var(--line); border-radius: 2px; }
</style>
</head>
<body>
<header id="head"></header>
<div class="bar"><div>
  <div class="seg" id="tab"></div>
  <div class="seg" id="theme"><button data-v="native" class="on">As designed</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
  <div class="seg" id="size"><button data-v="s">S</button><button data-v="m" class="on">M</button><button data-v="l">L · 1:1</button></div>
  <span class="hint">Spec card opens a direction · ← → to step · 1 to 9, 0 = #10 · Esc</span>
</div></div>
<main id="grid" class="board"></main>
<div class="focus" id="focus">
  <button class="close" id="close">Close · Esc</button>
  <button class="nav prev" id="prev">‹</button>
  <button class="nav next" id="next">›</button>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ROLES = ["ground", "surface", "surface-2", "border", "text", "text-2", "text-3", "action", "on-action", "accent", "on-accent", "good", "warn", "error", "focus"];
const RAMP = ["display", "h1", "h2", "h3", "lede", "body", "small", "caption", "eyebrow"];
let M, theme = "native", tab = "main", cur = -1;
const themes = {};

function applyTheme(t) {
  theme = t;
  document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
  document.querySelectorAll("#theme button").forEach((b) => b.classList.toggle("on", b.dataset.v === t));
  document.querySelectorAll("iframe").forEach(setFrameTheme);
}
// "native" shows each screen as designed (a dark-first direction sets data-theme="dark" itself);
// Light and Dark force every frame. The frame's own value is remembered so "As designed" restores it.
function setFrameTheme(f) {
  try {
    const h = f.contentDocument.documentElement;
    if (!("native" in f.dataset)) f.dataset.native = h.dataset.theme ?? "";
    const v = theme === "native" ? f.dataset.native : theme;
    if (v) h.dataset.theme = v; else delete h.dataset.theme;
  } catch {}
}
function frame(src, title, lazy = true) {
  const inner = /\.(png|jpe?g|webp)$/i.test(src)
    ? `<img src="${esc(src)}" alt="${esc(title)}">`
    : `<iframe ${lazy ? 'loading="lazy" ' : ""}src="${esc(src)}?theme=${theme}" title="${esc(title)}" onload="setFrameTheme(this)"></iframe>`;
  return `<div class="${M?.surface === "web" ? "desk" : "phone"}"><div class="viewport">${inner}</div></div>`;
}
function mainLabel() { return M.stage === "system" ? "System" : M.stage === "apply" ? `Apply · stage ${M.apply?.stage ?? ""}` : M.stage === "handoff" ? "Handoff" : "Directions"; }
function slabel(s) { return s.invented ? `${s.label} · invented` : s.label; }
function tabs() { return [M.before && ["before", "Before"], M.category && ["category", "Category"], ["main", mainLabel()]].filter(Boolean); }
function renderHead() {
  const r = M.round ?? 1;
  const rounds = Array.from({ length: r }, (_, k) => k + 1).map((k) => `<a href="../r${k}/" class="${k === r ? "on" : ""}">R${k}</a>`).join("");
  const fb = M.feedback ? `<div class="feedback"><b>Your feedback</b>${esc(M.feedback)}</div>` : "";
  $("#head").innerHTML = `<div class="crumbs">${esc(M.project ?? "")} / ${esc(M.topic ?? "")} · glow-up ${rounds}</div>
    <h1>${esc(M.title ?? "Glow-up")} <span style="color:var(--ink3);font-weight:600">· ${esc(mainLabel())}</span></h1>
    <p class="brief">${esc(M.brief ?? "")}</p>${fb}`;
}
function renderTabs() {
  $("#tab").innerHTML = tabs().map(([k, l]) => `<button data-v="${k}" class="${k === tab ? "on" : ""}">${esc(l)}</button>`).join("");
  document.querySelectorAll("#tab button").forEach((b) => (b.onclick = () => setTab(b.dataset.v)));
}
function setTab(k) {
  tab = k;
  const u = new URL(location.href); u.searchParams.set("tab", k); u.hash = ""; history.replaceState(null, "", u);
  renderTabs(); renderBody();
}
function rowMeta(v, i) {
  const badges = [v.id === M.agentPick && `<span class="chip pick">Claude’s pick</span>`, v.id === M.predictedPick && `<span class="chip fav">Your likely pick</span>`].filter(Boolean).join("");
  const tags = (v.tags ?? []).map((t) => `<span class="chip ${t === "wildcard" ? "wild" : ""}">${esc(t)}</span>`).join("");
  return `<div class="meta"><div class="top"><span class="num">${i + 1}</span><span class="name">${esc(v.name)}</span></div>
    <p class="idea">${esc(v.idea)}</p><div class="chips">${badges}${tags}</div>
    ${v.notes?.market ? `<p class="idea"><b>Market:</b> ${esc(v.notes.market)}</p>` : ""}
    <button class="more" data-i="${i}">Spec card</button></div>`;
}
function cells(items) { return items.map(([src, label, title]) => `<div class="cell"><div class="screenlbl">${esc(label)}</div>${src ? frame(src, title) : ""}</div>`).join(""); }
function renderMain() {
  const vs = M.variations ?? [];
  if (M.stage === "apply") {
    const a = M.apply ?? {};
    const rows = (a.routes ?? []).map((r) => `<section class="row pair" data-route="${esc(r.id)}"><div class="meta"><span class="name">${esc(r.label ?? r.id)}</span></div>
      ${cells([[r.before, "Before", `${r.label} before`], [r.after, "After", `${r.label} after`]])}</section>`).join("");
    const fu = (a.followUps ?? []).map((f) => `<li>${esc(f)}</li>`).join("");
    return `<p class="headline">${esc(a.headline ?? "")}</p>${rows}${fu ? `<div class="notes"><div><b>Recommended follow-ups</b><ul>${fu}</ul></div></div>` : ""}`;
  }
  if (M.stage === "system") {
    return vs.map((v, i) => `<section class="row sys" data-row="${esc(v.id)}">${rowMeta(v, i)}<div class="routes">${cells((M.routes ?? []).map((r) => [`${v.dir ?? v.id}/routes/${r.id}.html`, r.label ?? r.id, `${v.name} · ${r.label ?? r.id}`]))}</div></section>`).join("");
  }
  return vs.map((v, i) => `<section class="row" data-row="${esc(v.id)}">${rowMeta(v, i)}${cells((M.screens ?? []).map((s) => [`${v.dir ?? v.id}/${s.id}.html`, slabel(s), `${v.name} · ${s.label}`]))}</section>`).join("");
}
function renderBefore() {
  const b = M.before ?? {};
  return `<p class="headline">${esc(b.headline ?? "")}</p><section class="row before" data-row="before"><div class="meta"><span class="name">Before</span><p class="idea">${esc(b.summary ?? "")}</p></div>
    ${cells((M.screens ?? []).map((s) => [b[s.id], slabel(s), `Before · ${s.label}`]))}</section>`;
}
async function renderCategory() {
  try { const r = await fetch(M.category, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return `<pre class="cat">${esc(await r.text())}</pre>`; }
  catch (e) { return `<div class="err">Could not read ${esc(M.category)} (${esc(e.message)}).</div>`; }
}
const HANDOFF_FILES = ["prompt.md", "screens.md", "tokens.css", "tailwind-v4.css", "tailwind.config.v3.js", "shadcn.css", "shadcn-hsl.css", "theme.ts", "theme.css"];
async function renderHandoff() {
  const dir = M.handoff?.dir ?? "handoff";
  const read = async (f) => { try { const r = await fetch(`${dir}/${f}`, { cache: "no-store" }); return r.ok ? await r.text() : `(no ${f})`; } catch (e) { return `(no ${f})`; } };
  const links = HANDOFF_FILES.map((f) => `<a class="chip" href="${esc(dir)}/${esc(f)}" download>${esc(f)}</a>`).join(" ");
  return `<p class="headline">Paste prompt.md into your AI builder with these files.</p><div class="chips">${links}</div>
    <pre class="cat">${esc(await read("prompt.md"))}</pre><pre class="cat">${esc(await read("screens.md"))}</pre>`;
}
async function renderBody() {
  const g = $("#grid");
  g.innerHTML = tab === "before" ? renderBefore() : tab === "category" ? await renderCategory() : M.stage === "handoff" ? await renderHandoff() : renderMain();
  g.querySelectorAll("button.more").forEach((b) => (b.onclick = () => open(+b.dataset.i)));
}
async function loadTheme(v) {
  const dir = v.dir ?? v.id;
  if (!themes[dir]) themes[dir] = await fetch(`${dir}/theme.json`, { cache: "no-store" }).then((r) => r.json());
  return themes[dir];
}
function resolve(t, mode, role) {
  const v = t.color[mode][role]; const m = /^([a-z][a-z0-9-]*)\.(\d{1,2})$/.exec(v);
  return m ? t.color.primitives[m[1]][m[2]] : v;
}
function fontLink(t) {
  const q = [t.type.display, t.type.body, t.type.mono].filter((f) => f?.family)
    .map((f) => `family=${f.family.replace(/ /g, "+")}:wght@${[...new Set(f.weights)].sort((a, b) => a - b).join(";")}`).join("&");
  const href = `https://fonts.googleapis.com/css2?${q}&display=swap`;
  if (![...document.querySelectorAll("link")].some((l) => l.href === href)) document.head.insertAdjacentHTML("beforeend", `<link rel="stylesheet" href="${esc(href)}">`);
}
function spec(t, v) {
  fontLink(t);
  const mode = theme === "dark" ? "dark" : "light";
  const sw = ROLES.map((r) => `<i data-role="${r}" title="${r} ${esc(resolve(t, mode, r))}" style="background:${esc(resolve(t, mode, r))}"></i>`).join("");
  const fam = (face) => t.type[face]?.family ?? t.type.body.family;
  const ramp = RAMP.map((k) => { const r = t.type.ramp[k]; return `<div style="font-family:'${esc(fam(r.face))}';font-size:${Math.min(r.size, 40)}px;line-height:1.2;font-weight:${r.weight};letter-spacing:${r.track}em;${r.upper ? "text-transform:uppercase;" : ""}">${k} · ${r.size}/${r.line}</div>`; }).join("");
  const tpls = t.layout.templates.map((p) => { const n = Math.min(p.columns, 12); return `<div><div class="tpl" style="grid-template-columns:repeat(${n},1fr)">${"<i></i>".repeat(n)}</div><small>${esc(p.label)} · ${p.columns} col · ${p.max ? p.max + "px" : "full width"} · ${esc(p.density)}</small></div>`; }).join("");
  const st = t.states;
  const voice = t.voice.strings.map((s) => `<li><s>${esc(s.before)}</s> → ${esc(s.after)}</li>`).join("");
  const notes = Object.entries(v.notes ?? {}).map(([k, x]) => `<div><b>${esc(k)}</b>${esc(x)}</div>`).join("");
  return `<div class="spec" data-spec="${esc(v.id)}">
    <div><b class="lbl">Colour (${mode})</b><div class="sw">${sw}</div></div>
    <div><b class="lbl">Type · ${esc(t.type.display.family)} + ${esc(t.type.body.family)}</b>${ramp}<small>${esc(t.type.pairing)}</small></div>
    <div><b class="lbl">Layout · space ${t.layout.space.join(" ")}</b><div class="tpls">${tpls}</div></div>
    <div><b class="lbl">States</b><small>hover ${st.hover} · pressed ${st.pressed} · disabled ${st.disabled} · focus ${st.focus.width}px ring, ${st.focus.offset}px offset</small></div>
    <div><b class="lbl">Signature</b>${esc(t.signature.what)}<small>On ${esc(t.signature.where.join(", "))}. ${esc(t.signature.never)}</small></div>
    <div><b class="lbl">Voice · ${esc(t.voice.adjectives.join(", "))}</b><ul>${voice}</ul></div>
    <div class="notes">${notes}</div></div>`;
}
async function open(i) {
  const vs = M.variations ?? [];
  if (!vs.length || M.stage === "apply") return;
  cur = (i + vs.length) % vs.length;
  const v = vs[cur], f = $("#focus");
  f.querySelectorAll(".phone, .desk, .side").forEach((n) => n.remove());
  const first = M.stage === "system" ? `${v.dir ?? v.id}/routes/${M.routes?.[0]?.id}.html` : `${v.dir ?? v.id}/${M.screens?.[0]?.id ?? "s1"}.html`;
  f.insertAdjacentHTML("beforeend", frame(first, v.name, false) + `<div class="side"><div class="top"><span class="num">${cur + 1}</span> <span class="name">${esc(v.name)}</span></div><p class="idea">${esc(v.idea)}</p><div class="loading">Loading spec…</div></div>`);
  f.classList.add("open");
  history.replaceState(null, "", `${location.pathname}${location.search}#${v.id}`);
  try { const t = await loadTheme(v); f.querySelector(".loading").outerHTML = spec(t, v); }
  catch (e) { f.querySelector(".loading").textContent = `No readable theme.json (${e.message}).`; }
}
function close() { $("#focus").classList.remove("open"); cur = -1; history.replaceState(null, "", location.pathname + location.search); }
$("#close").onclick = close;
$("#prev").onclick = () => open(cur - 1);
$("#next").onclick = () => open(cur + 1);
document.querySelectorAll("#theme button").forEach((b) => (b.onclick = () => { applyTheme(b.dataset.v); if (cur >= 0) open(cur); }));
document.querySelectorAll("#size button").forEach((b) => (b.onclick = () => { document.body.dataset.size = b.dataset.v; document.querySelectorAll("#size button").forEach((x) => x.classList.toggle("on", x === b)); }));
addEventListener("keydown", (e) => {
  if (e.key === "Escape") return close();
  if (cur >= 0 && e.key === "ArrowRight") return open(cur + 1);
  if (cur >= 0 && e.key === "ArrowLeft") return open(cur - 1);
  if (/^[0-9]$/.test(e.key)) { const n = e.key === "0" ? 10 : +e.key; if (n <= (M.variations ?? []).length) open(n - 1); }
});
fetch("manifest.json", { cache: "no-store" }).then((r) => r.json()).then(async (m) => {
  M = m;
  document.body.classList.toggle("web", M.surface === "web");
  const q = new URLSearchParams(location.search).get("tab");
  tab = tabs().some(([k]) => k === q) ? q : "main";
  renderHead(); renderTabs(); await renderBody();
  const i = (M.variations ?? []).findIndex((x) => x.id === location.hash.slice(1));
  if (i >= 0) open(i);
}).catch((e) => { $("#grid").outerHTML = `<div class="err">No readable <code>manifest.json</code> next to this page (${esc(e.message)}).</div>`; });
</script>
