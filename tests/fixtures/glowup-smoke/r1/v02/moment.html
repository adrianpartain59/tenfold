<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · Moment</title>
<link rel="stylesheet" href="../web.css">
<link rel="stylesheet" href="tokens.css">
<style>@media (max-width: 600px) { main { padding-inline: var(--space-4); } }</style>
</head>
<body data-template="column">
<main class="tpl-column">
  <h2 class="t-h2 rule">No notes yet</h2>
  <p class="t-body">The ruled line draws in once.</p>
  <style>.rule { background: linear-gradient(var(--c-action), var(--c-action)) 0 100% / 0 2px no-repeat; animation: draw var(--dur-slow) var(--ease-out) forwards; } @keyframes draw { to { background-size: 100% 2px; } } @media (prefers-reduced-motion: reduce) { .rule { animation: none; background-size: 100% 2px; } }</style>
</main>
</body>
</html>
